name: Deploy to anynines PaaS (Account 3)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 */25 * *'

jobs:
  deploy:
    name: Deploy to anynines (Account 3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cloud Foundry CLI
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo gpg --dearmor -o /usr/share/keyrings/cloudfoundry.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudfoundry.gpg] https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install -y cf8-cli

      - name: Login & Target anynines Space
        env:
          CF_DIAL_TIMEOUT: 60
        run: |
          cf login -a https://api.de.a9s.eu -u "${{ secrets.A9S_USERNAME || 'liwo1861a@gmail.com' }}" -p "${{ secrets.A9S_PASSWORD || 'LLHlys123...' }}" -o liwo1861a_gmail_com -s production

      - name: Deploy AFK Keep-Alive Service
        env:
          CF_DIAL_TIMEOUT: 60
        run: |
          echo "Pushing application to anynines..."
          cf push || (echo "Retrying cf push after 15s..." && sleep 15 && cf push)
