---
applications:
- name: zenix-afk
  command: node index.js
  buildpacks:
    - https://github.com/cloudfoundry/apt-buildpack.git
    - nodejs_buildpack
  routes:
    - route: zenix-afk-node.de.a9sapp.eu
  health-check-type: port
  memory: 512M
  disk_quota: 1024M
  env:
    NODE_ENV: production
    PORT: 8080
